<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prévia — Foguete VagaAI</title>
  <link rel="stylesheet" href="/loading-comet.css">
  <link rel="stylesheet" href="./preview.css">
</head>
<body>
  <main class="preview-shell">
    <header>
      <span class="eyebrow">VagaAI · carregamento global</span>
      <h1>Loading rocket</h1>
      <p>Arte e movimento originais, agora com a paleta verde do produto.</p>
    </header>

    <section class="stage" aria-label="Prévia da animação de carregamento">
      <div class="spinner" role="img" aria-label="Foguete verde do VagaAI em movimento"></div>
      <span class="loading-label">Carregando...</span>
    </section>

    <footer>
      <span>292 × 307 px</span>
      <span>8,04 segundos</span>
      <span>29,97 FPS</span>
      <span>SVG + imagens incorporadas</span>
    </footer>
  </main>

  <script src="/js/loading-comet.js"></script>
</body>
</html>
