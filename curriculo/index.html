<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VagaAI — Meu Currículo</title>
<meta name="description" content="Seu currículo, sempre atualizado. Preencha seus dados e veja o que o mercado espera de você.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script defer src="/_vercel/insights/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/cv-voice.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f0d;--surface:#111814;--surface2:#161d19;--border:rgba(255,255,255,0.07);
  --text:#e8ede9;--muted:#8a9e90;--green:#3ecf8e;--green-dim:rgba(62,207,142,0.12);
  --green-border:rgba(62,207,142,0.25);--red:#ff6b6b;--red-dim:rgba(255,107,107,0.12);
  --yellow:#ffd166;--yellow-dim:rgba(255,209,102,0.12);
}
[data-theme="light"]{--bg:#f2f6f3;--surface:#ffffff;--surface2:#eaf0ec;--border:rgba(0,0,0,0.09);--text:#0d1a11;--muted:#4d6e57;--green:#1a8f5c;--green-dim:rgba(26,143,92,0.1);--green-border:rgba(26,143,92,0.25);--red:#c0392b;--red-dim:rgba(192,57,43,0.08);--yellow:#b07d1a;--yellow-dim:rgba(176,125,26,0.08)}
body{background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
.container{max-width:820px;margin:0 auto;padding:2.5rem 1.5rem 5rem}
.page-title{font-family:'Lora',serif;font-size:clamp(22px,4vw,32px);font-weight:700;line-height:1.15}
.page-sub{color:var(--muted);font-size:14px;margin-top:.35rem;max-width:600px}

/* Draft banner (anônimo) */
.draft-banner{background:var(--yellow-dim);border:1px solid var(--yellow);border-radius:12px;padding:.9rem 1.1rem;font-size:13px;margin:1.2rem 0;display:none}
.draft-banner.show{display:block}

/* Header / completude */
.profile-head{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.4rem 1.5rem;margin:1.4rem 0;display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.profile-avatar{width:52px;height:52px;border-radius:50%;background:var(--green-dim);border:1px solid var(--green-border);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}
.profile-name{font-weight:800;font-size:18px}
.profile-role{color:var(--muted);font-size:13px;margin-top:2px}
.completude-wrap{flex:1;min-width:180px}
.completude-bar{height:7px;background:var(--surface2);border-radius:20px;overflow:hidden;margin-top:.4rem}
.completude-fill{height:100%;background:var(--green);border-radius:20px;transition:width .4s}
.completude-label{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between}
.save-btn{background:var(--green);color:#06130b;border:none;font-weight:800;font-size:13.5px;padding:.7rem 1.3rem;border-radius:10px;cursor:pointer;white-space:nowrap;transition:filter .2s}
.save-btn:hover{filter:brightness(1.08)}
.save-btn[disabled]{opacity:.6;cursor:not-allowed}
.save-status{font-size:12px;color:var(--muted);margin-left:.6rem}

/* Gap panel — hero card, mesmo padrão visual do topo de Entrevistas */
.gap-panel{
  background:linear-gradient(125deg,#07170f 0%,#0f3b25 60%,#155a37 100%);
  border-radius:18px;padding:2rem 2.2rem;margin-bottom:1.4rem;color:#fff;
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(240px,.85fr);
  gap:1.8rem;align-items:center;position:relative;overflow:hidden;
  box-shadow:0 18px 45px rgba(7,32,19,.18);
}
.gap-panel::before{content:'';position:absolute;right:-110px;top:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(78,206,145,.24),transparent 68%)}
.gap-copy{position:relative;z-index:1}
.gap-title{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#7ff0b7;margin-bottom:12px}
.gap-title::before{content:'';width:7px;height:7px;border-radius:50%;background:#4ece91}
.gap-h2{font-family:'Lora',serif;font-size:26px;line-height:1.16;letter-spacing:-.4px;margin-bottom:10px}
.gap-sub{font-size:13px;line-height:1.7;color:rgba(230,247,236,.72);max-width:460px}
.gap-metrics{display:flex;gap:26px;flex-wrap:wrap;margin-top:20px}
.gap-metrics div{min-width:82px}
.gap-metrics strong{display:block;font-size:26px;line-height:1;font-weight:800;color:#fff;letter-spacing:-.5px}
.gap-metrics span{display:block;margin-top:4px;font-size:11px;color:rgba(230,247,236,.58)}
.gap-side{position:relative;z-index:1;background:rgba(13,22,16,.55);border:1px solid rgba(78,206,145,.22);border-radius:14px;padding:1.1rem 1.2rem}
.gap-side-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:rgba(230,247,236,.6);margin-bottom:.7rem}
.gap-empty{font-size:13.5px;color:rgba(230,247,236,.8)}
.gap-chips{display:flex;flex-wrap:wrap;gap:.45rem}
.gap-chip{font-size:12px;font-weight:700;background:rgba(255,209,102,.14);border:1px solid rgba(255,209,102,.5);color:#ffd166;padding:.3rem .7rem;border-radius:20px}
.gap-chip b{font-weight:800}
@media(max-width:720px){.gap-panel{grid-template-columns:1fr;padding:1.6rem}}

/* Section cards */
.sec-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.2rem 1.4rem;margin-bottom:.9rem}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem}
.sec-title{font-size:14px;font-weight:800;display:flex;align-items:center;gap:.4rem}
.sec-title svg{color:var(--green)}
.profile-main-label{font-size:9.5px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:var(--green);margin-bottom:6px}.profile-purpose{font-size:11px;color:var(--muted);margin-top:6px;max-width:390px;line-height:1.45}.profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;min-width:250px}.profile-actions .save-btn{grid-column:1/-1}.profile-danger{grid-column:1/-1;border:0;background:none;color:var(--red);font:700 11px Manrope,sans-serif;cursor:pointer;padding:4px}.profile-danger:hover{text-decoration:underline}
.versions-intro{font-size:12px;color:var(--muted);line-height:1.5;margin-top:5px}.version-tabs{display:flex;gap:6px;margin-top:14px}.version-tab{border:1px solid var(--border);border-radius:999px;background:var(--surface2);color:var(--muted);padding:6px 10px;font:700 11px Manrope,sans-serif;cursor:pointer}.version-tab.active{border-color:var(--green-border);background:var(--green-dim);color:var(--green)}.version-list{display:grid;gap:8px;margin-top:12px}.version-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);border-radius:11px;background:var(--surface2)}.version-row-copy{flex:1;min-width:0}.version-row-copy b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.version-row-copy>span{display:block;margin-top:3px;color:var(--muted);font-size:11px}.version-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.version-chip{font-size:9.5px;font-weight:800;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 7px;background:var(--surface)}.version-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}.version-action{border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:7px 9px;font:700 10.5px Manrope,sans-serif;cursor:pointer;white-space:nowrap}.version-action.primary{border-color:var(--green-border);background:var(--green-dim);color:var(--green)}.version-action.danger{color:var(--red)}.versions-more{width:100%;margin-top:10px;border:1px dashed var(--border);border-radius:9px;background:none;color:var(--muted);padding:8px;font:700 11px Manrope,sans-serif;cursor:pointer}
.sec-edit{font-size:12.5px;font-weight:700;color:var(--green);background:none;border:none;cursor:pointer}
.sec-edit:hover{text-decoration:underline}
.sec-empty{color:var(--muted);font-size:13px;margin-top:.4rem}
.sec-item{padding:.5rem 0;border-top:1px solid var(--border)}
.sec-item:first-of-type{border-top:none;padding-top:.6rem}
.sec-item-title{font-weight:700;font-size:13.5px}
.sec-item-sub{font-size:12px;color:var(--muted);margin-top:1px}
.sec-item ul{margin:.35rem 0 0 1.1rem;font-size:12.5px;color:var(--text)}
.tag-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}
.tag{font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--border);padding:.28rem .7rem;border-radius:20px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;z-index:200;padding:2rem 1rem;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:600px;width:100%;padding:1.6rem;position:relative}
.modal-close{position:absolute;top:14px;right:14px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer}
.modal h3{font-family:'Lora',serif;font-size:19px;margin-bottom:1rem;padding-right:2rem}
.f-row{margin-bottom:.8rem}
.f-row label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:.3rem}
.f-row input,.f-row textarea,.f-row select{width:100%;padding:.6rem .7rem;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:'Manrope',sans-serif;font-size:13.5px}
.f-row textarea{resize:vertical;min-height:70px}
.f-grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.list-row{border:1px solid var(--border);border-radius:10px;padding:.9rem;margin-bottom:.7rem;position:relative}
.list-row-remove{position:absolute;top:.6rem;right:.6rem;background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px}
.list-row-remove:hover{color:var(--red)}
.add-row-btn{width:100%;padding:.6rem;border:1px dashed var(--border);border-radius:9px;background:none;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.add-row-btn:hover{border-color:var(--green-border);color:var(--green)}
.modal-actions{display:flex;gap:.6rem;margin-top:1.2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-family:'Manrope',sans-serif;font-size:13.5px;font-weight:700;padding:.65rem 1.1rem;border-radius:10px;border:1px solid transparent;cursor:pointer}
.btn-primary{background:var(--green);color:#06130b}
.btn-ghost{background:var(--surface2);color:var(--text);border-color:var(--border)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--green-border);color:var(--text);padding:.7rem 1.2rem;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:300;max-width:90vw;text-align:center}
.toast.vis{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--red)}
/* Nav mínima quando a página é acessada fora do painel (funil público) */
.standalone-nav{display:none;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 1.5rem;border-bottom:1px solid var(--border);background:var(--surface)}
.standalone-nav.show{display:flex}
.sn-brand img{height:30px;width:auto;display:block}
.sn-brand .logo-light{display:none}
[data-theme="light"] .sn-brand .logo-dark{display:none}
[data-theme="light"] .sn-brand .logo-light{display:block}
.sn-link{font-size:13px;font-weight:700;color:var(--green);text-decoration:none}
.sn-link:hover{text-decoration:underline}

/* Card de importação (estado vazio) */
.import-card{background:var(--surface);border:1px dashed var(--green-border);border-radius:14px;padding:1.2rem 1.4rem;margin-bottom:.9rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.import-card p{font-size:13.5px;color:var(--muted);max-width:420px}
.import-card p b{color:var(--text)}

.loading{text-align:center;padding:4rem 0;color:var(--muted);font-size:14px}
.spinner{display:inline-block;width:22px;height:22px;border:2.5px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:.5rem}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:560px){.f-grid2{grid-template-columns:1fr}.profile-head{flex-direction:column;align-items:flex-start}.save-btn{width:100%}.profile-actions{width:100%;min-width:0}.version-row{align-items:flex-start;flex-direction:column}.version-actions{width:100%;justify-content:flex-start}.version-action{flex:1}.version-row-copy{width:100%}}
</style>
</head>
<body>
<div class="standalone-nav" id="standaloneNav">
  <a class="sn-brand" href="/" aria-label="VagaAI — página inicial">
    <img src="/logo.svg" alt="VagaAI" class="logo-dark">
    <img src="/logo-light.svg" alt="VagaAI" class="logo-light">
  </a>
  <a class="sn-link" id="snRight" href="/dashboard">Ir para o painel →</a>
</div>
<div class="container">
  <h1 class="page-title">Meus currículos</h1>
  <p class="page-sub">Mantenha um currículo base completo e crie versões direcionadas somente quando houver uma vaga.</p>

  <div class="draft-banner" id="draftBanner">Você está editando sem estar logado — nada será perdido, mas <b>salve para não perder seu progresso</b> e poder usar esse currículo nas análises de vaga.</div>

  <div id="mainArea"><div class="loading"><span class="spinner"></span>Carregando...</div></div>
  <input type="file" id="uploadInput" accept=".txt,.pdf,.doc,.docx" style="display:none" onchange="handleUploadFile(this)">
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal"><button class="modal-close" onclick="closeModal()">✕</button><div id="modalContent"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL = 'https://kbcjchjepgejdezeuwwh.supabase.co';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtiY2pjaGplcGdlamRlemV1d3doIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3NzA4OTcsImV4cCI6MjA5MjM0Njg5N30.k2julxPkEm4kgtw5dBy6S8hlSrVBqebe-A_GfzcW2HA';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
var DRAFT_KEY = 'vagaai_cv_draft';
var DRAFT_AT_KEY = 'vagaai_cv_draft_updated_at';
var BASE_KEY = 'vagaai_cv_base';

(function(){ var t=null; try{ t=localStorage.getItem('vagaai_theme'); }catch(e){} if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme', t); })();

var _session = null;
var _cv = null;          // { id, cv_data, ... } | null se ainda não existe registro
var _cvData = null;      // atalho pro objeto de dados em edição
var _isEmbedded = window.self !== window.top || new URLSearchParams(location.search).get('embedded') === '1';
var _saveTimer = null;
var _dirty = false;
var _versionsById = {};
var _versionStatusByAnalysis = {};
var _versionView = 'active';
var _showAllVersions = false;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg, isErr){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.toggle('err',!!isErr); t.classList.add('vis'); clearTimeout(t._tm); t._tm=setTimeout(function(){t.classList.remove('vis');},3000); }
function emptyCv(){ return { nome:'', contato:{email:'',telefone:'',linkedin:'',cidade:''}, titulo_profissional:'', resumo_profissional:'', experiencias:[], formacao:[], cursos:[], idiomas:[], habilidades:[] }; }

/* ── Init ── */
(async function init(){
  var s = await sb.auth.getSession();
  _session = s && s.data && s.data.session;
  // Fora do painel (funil público /criar-curriculo, link direto), mostra uma
  // nav mínima — sem ela o visitante ficava numa página sem logo nem saída.
  if (!_isEmbedded) {
    document.getElementById('standaloneNav').classList.add('show');
    var snRight = document.getElementById('snRight');
    if (!_session) { snRight.href = '/login?next=%2Fcurriculo'; snRight.textContent = 'Entrar'; }
  }
  var draft = null;
  var draftAt = 0;
  try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); draftAt = Number(localStorage.getItem(DRAFT_AT_KEY) || 0); } catch(e) {}
  if (_session) {
    var r = await sb.from('cv_saves').select('*').eq('user_id', _session.user.id).order('updated_at', { ascending: false }).limit(1);
    _cv = r && r.data && r.data[0];
    if (_cv) {
      _cvData = normalize(_cv.cv_data);
      try { localStorage.setItem(BASE_KEY, JSON.stringify(_cvData)); } catch(e) {}
      var cloudAt = Date.parse(_cv.updated_at || 0) || 0;
      if (draft && draftAt > cloudAt) {
        _cvData = normalize(draft);
        _dirty = true;
        var banner = document.getElementById('draftBanner');
        banner.innerHTML = 'Encontramos altera&ccedil;&otilde;es mais recentes neste dispositivo. <b>Revise e salve</b> para atualizar seu curr&iacute;culo na conta.';
        banner.classList.add('show');
      }
    }
  }
  if (!_cvData) {
    // sem sessão, ou sessão sem currículo salvo ainda: tenta retomar rascunho local
    _cvData = draft ? normalize(draft) : emptyCv();
    if (!_session) document.getElementById('draftBanner').classList.add('show');
  }
  render();
})();

function normalize(d) {
  d = d || {};
  if (d.raw_text && !d.nome && !(d.experiencias && d.experiencias.length)) {
    // currículo enviado como arquivo (upload) — sem estrutura ainda
    var base = emptyCv();
    base.raw_text = d.raw_text;
    return base;
  }
  var base = emptyCv();
  base.nome = d.nome || '';
  base.contato = Object.assign({email:'',telefone:'',linkedin:'',cidade:''}, d.contato || {});
  base.titulo_profissional = d.titulo_profissional || '';
  base.resumo_profissional = d.resumo_profissional || '';
  base.experiencias = Array.isArray(d.experiencias) ? d.experiencias : [];
  base.formacao = Array.isArray(d.formacao) ? d.formacao : [];
  base.cursos = Array.isArray(d.cursos) ? d.cursos : [];
  base.idiomas = Array.isArray(d.idiomas) ? d.idiomas : [];
  base.habilidades = Array.isArray(d.habilidades) ? d.habilidades.map(function(s){ return typeof s === 'string' ? s : (s && s.nome) || ''; }).filter(Boolean) : [];
  if (d.raw_text) base.raw_text = String(d.raw_text);
  return base;
}

function cvToText(d) {
  if (!d) return '';
  if (d.raw_text && !d.nome) return d.raw_text;
  var L = [];
  if (d.nome) L.push(d.nome);
  if (d.titulo_profissional) L.push(d.titulo_profissional);
  var c = d.contato || {};
  var ct = [c.email, c.telefone, c.linkedin, c.cidade].filter(Boolean).join(' | ');
  if (ct) L.push(ct);
  if (d.resumo_profissional) { L.push(''); L.push('RESUMO PROFISSIONAL'); L.push(d.resumo_profissional); }
  if ((d.experiencias||[]).length) {
    L.push(''); L.push('EXPERIÊNCIA PROFISSIONAL');
    d.experiencias.forEach(function(e){
      L.push([e.cargo, e.empresa].filter(Boolean).join(' — ') + (e.periodo ? ' (' + e.periodo + ')' : ''));
      (e.bullets || []).forEach(function(b){ if(b) L.push('- ' + b); });
    });
  }
  if ((d.formacao||[]).length) {
    L.push(''); L.push('FORMAÇÃO ACADÊMICA');
    d.formacao.forEach(function(e){ L.push([e.curso, e.instituicao].filter(Boolean).join(' — ') + (e.periodo ? ' (' + e.periodo + ')' : '')); });
  }
  if ((d.cursos||[]).length) {
    L.push(''); L.push('CURSOS E ESPECIALIZAÇÕES');
    d.cursos.forEach(function(e){ L.push([e.nome, e.instituicao].filter(Boolean).join(' — ') + (e.periodo ? ' (' + e.periodo + ')' : '')); });
  }
  if ((d.idiomas||[]).length) {
    L.push(''); L.push('IDIOMAS');
    d.idiomas.forEach(function(e){ L.push([e.idioma, e.nivel].filter(Boolean).join(' — ')); });
  }
  if ((d.habilidades||[]).length) { L.push(''); L.push('HABILIDADES'); L.push(d.habilidades.join(', ')); }
  if (d.raw_text) { L.push(''); L.push('CONTEÚDO DO CURRÍCULO IMPORTADO'); L.push(d.raw_text); }
  return L.join('\n');
}

function completude(d) {
  var checks = [!!d.nome, !!d.titulo_profissional, !!d.resumo_profissional, (d.experiencias||[]).length>0, (d.formacao||[]).length>0, (d.habilidades||[]).length>0];
  var done = checks.filter(Boolean).length;
  return Math.round(done / checks.length * 100);
}

async function saveProfile() {
  if (!_session) {
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(_cvData)); localStorage.setItem(DRAFT_AT_KEY, String(Date.now())); } catch(e) {}

  var pending = null;

/* ── Upload de currículo pronto (PDF/Word/TXT → texto) ── */
function loadScript(src) {
  return new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function extractPdfText(file) {
  if (!window.pdfjsLib) {
    await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  }
  var ab = await file.arrayBuffer();
  var pdf = await pdfjsLib.getDocument({ data: ab }).promise;
  var out = [];
  for (var i = 1; i <= pdf.numPages; i++) {
    var page = await pdf.getPage(i);
    var tc = await page.getTextContent();
    out.push(tc.items.map(function(it){ return it.str; }).join(' '));
  }
  return out.join('\n\n');
}

async function handleUploadFile(input) {
  var file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { toast('Arquivo muito grande (máx. 8MB).', true); return; }
  toast('Lendo arquivo...');
  var text = '';
  try {
    var ext = (file.name.split('.').pop() || '').toLowerCase();
    if (ext === 'pdf') {
      text = await extractPdfText(file);
    } else if (ext === 'doc' || ext === 'docx') {
      if (!window.mammoth) await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js');
      var result = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
      text = result.value || '';
    } else {
      text = await file.text();
    }
  } catch(e) {
    toast('Não foi possível ler o arquivo. Tente PDF, Word ou TXT.', true);
    return;
  }
  text = (text || '').trim();
  if (text.length < 120) { toast('Não encontramos texto suficiente no arquivo. Verifique se o currículo não é uma imagem escaneada.', true); return; }
  _cvData = emptyCv();
  _cvData.raw_text = text.slice(0, 30000);
  try {
    var extractRes = await fetch('/api/analyze', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ action:'onboarding_cv_extract', cv:text.slice(0,15000) }) });
    var extracted = extractRes.ok ? await extractRes.json() : null;
    var f = extracted && extracted.form || {};
    _cvData.nome = String(f.nome || '').trim();
    _cvData.titulo_profissional = String(f.cargo || '').trim();
    _cvData.contato = { email:String(f.email || '').trim(), telefone:String(f.tel || '').trim(), linkedin:'', cidade:String(f.cidade || '').trim() };
    _cvData.habilidades = String(f.skills || '').split(/[,;\n]/).map(function(s){return s.trim();}).filter(Boolean);
    var expText = String(f.exp || '').trim();
    var formText = String(f.form || '').trim();
    if (expText) _cvData.experiencias = [{ cargo:_cvData.titulo_profissional || 'Experiência profissional', empresa:'', periodo:'', bullets:expText.split(/\n+/).map(function(s){return s.replace(/^[-•]\s*/, '').trim();}).filter(Boolean) }];
    if (formText) _cvData.formacao = [{ curso:formText, instituicao:'', periodo:'' }];
  } catch(e) { /* o texto integral continua preservado como fonte */ }
  markDirty();
  render();
  toast('✓ Currículo importado e organizado — revise antes de salvar');
}

async function deleteBaseCv() {
  var hasData = _cv || completude(_cvData) > 0 || _cvData.raw_text;
  if (!hasData) { toast('Nenhum currículo base para excluir.', true); return; }
  var ok = window.confirm('Excluir seu currículo base?\n\nOs currículos criados para vagas continuarão disponíveis. Novas análises e alertas terão menos informações até você criar ou importar outro currículo base.');
  if (!ok) return;
  try {
    if (_session) {
      var removed = await sb.from('cv_saves').delete().eq('user_id', _session.user.id);
      if (removed.error) throw removed.error;
    }
    ['vagaai_cv_base','vagaai_cv','vagaai_cv_draft','vagaai_cv_draft_updated_at'].forEach(function(key){ try { localStorage.removeItem(key); } catch(e) {} });
    _cv = null;
    _cvData = emptyCv();
    _dirty = false;
    render();
    toast('Currículo base excluído. Seus currículos para vagas foram preservados.');
  } catch(e) {
    toast('Não foi possível excluir o currículo base. Tente novamente.', true);
  }
}

async function loadVersionsPanel() {
  var panel = document.getElementById('versionsPanel');
  if (!panel) return;
  if (!_session) {
    panel.innerHTML = '<div class="sec-head"><div class="sec-title">2 · Currículos para vagas</div></div><p class="versions-intro">Cópias direcionadas para oportunidades específicas. Cada uma fica ligada à sua vaga e nunca altera o currículo base.</p><p class="sec-empty">Crie sua conta para organizar aqui os currículos direcionados para cada vaga.</p>';
    return;
  }
  try {
    var response = await sb.from('analyses').select('id,score,result,created_at,archived_at').eq('user_id', _session.user.id).order('created_at', { ascending:false }).limit(100);
    if (response.error) throw response.error;
    var rows = (response.data || []).filter(function(row){ return row.result && row.result.cv_otimizado; });
    _versionsById = {};
    rows.forEach(function(row){ _versionsById[row.id] = row; });
    _versionStatusByAnalysis = {};

      var tracker = await sb.from('job_tracker').select('analysis_id,status').eq('user_id', _session.user.id).in('analysis_id', rows.map(function(row){ return row.id; }));
      (tracker.data || []).forEach(function(item){ if (item.analysis_id) _versionStatusByAnalysis[item.analysis_id] = item.status || ''; });
    }

  } catch(e) {
    panel.innerHTML = '<div class="sec-head"><div class="sec-title">2 · Currículos para vagas</div></div><p class="versions-intro">Cópias direcionadas para oportunidades específicas. Cada uma fica ligada à sua vaga e nunca altera o currículo base.</p><p class="sec-empty">Não foi possível carregar os currículos agora.</p>';
  }
}

function versionStatusLabel(status) {
  var labels = { quero_aplicar:'Quero aplicar', aplicada:'Candidatura enviada', entrevista:'Em entrevista', oferta:'Oferta', rejeitada:'Encerrada' };
  return labels[status] || 'Analisada';
}

function renderVersionsPanel() {
  var panel = document.getElementById('versionsPanel');
  if (!panel) return;
  var rows = Object.keys(_versionsById).map(function(id){ return _versionsById[id]; }).filter(function(row){ return row && row.result && row.result.cv_otimizado; });
  var active = rows.filter(function(row){ return !row.result.cv_version_archived_at; });
  var archived = rows.filter(function(row){ return !!row.result.cv_version_archived_at; });
  var visible = _versionView === 'archived' ? archived : active;
  var shown = _showAllVersions ? visible : visible.slice(0,8);
  var intro = '<p class="versions-intro">Cópias direcionadas para oportunidades específicas. Cada uma fica ligada à sua vaga e nunca altera o currículo base.</p>';
  var tabs = '<div class="version-tabs"><button class="version-tab ' + (_versionView === 'active' ? 'active' : '') + '" onclick="setVersionView(\'active\')">Ativas (' + active.length + ')</button><button class="version-tab ' + (_versionView === 'archived' ? 'active' : '') + '" onclick="setVersionView(\'archived\')">Arquivadas (' + archived.length + ')</button></div>';
  var head = '<div class="sec-head"><div class="sec-title">2 · Currículos para vagas</div><span class="save-status">' + rows.length + ' no total</span></div>' + intro + tabs;
  if (!rows.length) {
    panel.innerHTML = head + '<p class="sec-empty">Quando você adaptar o currículo para uma vaga, a nova versão aparecerá aqui sem substituir o currículo base.</p>';
    return;
  }
  if (!visible.length) {
    panel.innerHTML = head + '<p class="sec-empty">' + (_versionView === 'archived' ? 'Nenhuma versão arquivada.' : 'Nenhuma versão ativa.') + '</p>';
    return;
  }
  var list = shown.map(function(row){
    var result = row.result || {};
    var info = result.job_info || {};
    var title = info.titulo || info.cargo || 'Vaga analisada';
    var company = info.empresa || 'Empresa não informada';
    var versionDate = result.cv_version_updated_at || row.created_at;
    var date = new Date(versionDate).toLocaleDateString('pt-BR');
    var scoreValue = row.score == null ? result.score : row.score;
    var score = scoreValue == null ? '—' : Math.round(Number(scoreValue)) + '%';
    var status = versionStatusLabel(_versionStatusByAnalysis[row.id]);
    var analysisState = row.archived_at ? 'Análise arquivada' : status;
    var actions = _versionView === 'archived'
      ? '<button class="version-action" onclick="changeVersionState(\'' + row.id + '\',\'restore\')">Restaurar</button><button class="version-action danger" onclick="changeVersionState(\'' + row.id + '\',\'delete\')">Excluir definitivamente</button>'
      : '<button class="version-action primary" onclick="openCvVersion(\'' + row.id + '\')">Editar e baixar</button><button class="version-action" onclick="changeVersionState(\'' + row.id + '\',\'archive\')">Arquivar</button><button class="version-action danger" onclick="changeVersionState(\'' + row.id + '\',\'delete\')">Excluir</button>';
    return '<div class="version-row"><div class="version-row-copy"><b>' + esc(title) + '</b><span>' + esc(company) + ' · atualizada em ' + date + '</span><div class="version-meta"><span class="version-chip">Score ' + esc(score) + '</span><span class="version-chip">' + esc(analysisState) + '</span></div></div><div class="version-actions">' + actions + '</div></div>';
  }).join('');
  var more = visible.length > 8 ? '<button class="versions-more" onclick="toggleAllVersions()">' + (_showAllVersions ? 'Mostrar menos' : 'Ver todas as ' + visible.length + ' versões') + '</button>' : '';
  panel.innerHTML = head + '<div class="version-list">' + list + '</div>' + more;
}

function setVersionView(view) {
  _versionView = view === 'archived' ? 'archived' : 'active';
  _showAllVersions = false;
  renderVersionsPanel();
}

function toggleAllVersions() {
  _showAllVersions = !_showAllVersions;
  renderVersionsPanel();
}

async function changeVersionState(id, action) {
  var row = _versionsById[id];
  if (!row || !row.result) return;
  if (action === 'archive' && !window.confirm('Arquivar esta versão? Ela sairá da lista ativa, mas continuará disponível para restauração e para os recursos ligados à vaga.')) return;
  if (action === 'delete' && !window.confirm('Excluir esta versão definitivamente? A análise e a candidatura continuarão salvas, mas carta e entrevista poderão perder o currículo direcionado desta vaga.')) return;
  var result = Object.assign({}, row.result);
  if (action === 'archive') result.cv_version_archived_at = new Date().toISOString();
  if (action === 'restore') result.cv_version_archived_at = null;
  if (action === 'delete') {
    delete result.cv_otimizado;
    result.cv_version_deleted_at = new Date().toISOString();
    result.cv_version_archived_at = null;
  }
  try {
    var saved = await sb.from('analyses').update({ result:result }).eq('id', id).eq('user_id', _session.user.id);
    if (saved.error) throw saved.error;
    if (action === 'delete') delete _versionsById[id];
    else _versionsById[id].result = result;
    renderVersionsPanel();
    toast(action === 'archive' ? 'Versão arquivada.' : action === 'restore' ? 'Versão restaurada.' : 'Versão excluída. A análise e a candidatura foram preservadas.');
  } catch(e) {
    toast('Não foi possível atualizar esta versão. Tente novamente.', true);
  }
}

function openCvVersion(id) {
  var row = _versionsById[id];
  if (!row || !row.result || !row.result.cv_otimizado) return;
  var result = row.result;
  try {
    localStorage.setItem('vagaai_cv_version', JSON.stringify(result.cv_otimizado));
    localStorage.setItem('vagaai_cv_editor_source', 'version');
    localStorage.setItem('vagaai_cv_from_analysis', '1');
    localStorage.setItem('vagaai_cv_context', JSON.stringify({ analysis_id:id, score:result.score, score_estimado_apos_ajustes:result.score_estimado_apos_ajustes, nivel:result.nivel, resumo:result.resumo, job_info:result.job_info || {}, keywords_encontradas:result.keywords_encontradas || [], keywords_faltando:result.keywords_faltando || [], fatores:result.fatores || {}, briefing_empresa:result.briefing_empresa || {} }));
  } catch(e) {}
  if (_isEmbedded && window.parent && window.parent !== window) {
    try { window.parent.postMessage({ type:'vagaai-nav', frame:true, href:'/cv?source=version&analysis=' + encodeURIComponent(id), id:'curriculo' }, '*'); return; } catch(e) {}
  }
  location.href = '/cv?source=version&analysis=' + encodeURIComponent(id);
}

    '</div>';
}

function secExperiencias(d) {
  var exps = d.experiencias || [];
  var body = exps.length ? exps.map(function(e){
    return '<div class="sec-item"><div class="sec-item-title">' + esc(e.cargo||'') + (e.empresa?' — '+esc(e.empresa):'') + '</div>' +
      (e.periodo ? '<div class="sec-item-sub">' + esc(e.periodo) + '</div>' : '') +
      ((e.bullets||[]).filter(Boolean).length ? '<ul>' + e.bullets.filter(Boolean).map(function(b){return '<li>'+esc(b)+'</li>';}).join('') + '</ul>' : '') +

  return '<div class="sec-card">' + secHead('briefcase','Experiências profissionais','editExperiencias()') + body + '</div>';
}

function secCursos(d) {

function secIdiomas(d) {

function secResumo(d) {

/* ── Modal genérico ── */
function openModal(html) { document.getElementById('modalContent').innerHTML = html; document.getElementById('modalBg').classList.add('open'); }
function closeModal() { document.getElementById('modalBg').classList.remove('open'); }

function saveAndClose(applyFn) {
  applyFn();
  markDirty();
  closeModal();
  render();
}

/* ── Editores simples (campo único / poucos campos) ── */
function editDadosPessoais() {
  var c = _cvData.contato || {};
  openModal(
    '<h3>Dados pessoais</h3>' +
    '<div class="f-row"><label>Nome completo</label><input id="mNome" value="' + esc(_cvData.nome) + '"></div>' +
    '<div class="f-grid2"><div class="f-row"><label>E-mail</label><input id="mEmail" value="' + esc(c.email) + '"></div>' +
    '<div class="f-row"><label>Telefone</label><input id="mTel" value="' + esc(c.telefone) + '"></div></div>' +
    '<div class="f-grid2"><div class="f-row"><label>LinkedIn</label><input id="mLinkedin" value="' + esc(c.linkedin) + '"></div>' +
    '<div class="f-row"><label>Cidade</label><input id="mCidade" value="' + esc(c.cidade) + '"></div></div>' +
    '<div class="modal-actions"><button class="btn btn-primary" onclick="saveDadosPessoais()">Salvar</button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button></div>'
  );
}
function saveDadosPessoais() {
  saveAndClose(function(){
    _cvData.nome = document.getElementById('mNome').value.trim();
    _cvData.contato = { email: document.getElementById('mEmail').value.trim(), telefone: document.getElementById('mTel').value.trim(), linkedin: document.getElementById('mLinkedin').value.trim(), cidade: document.getElementById('mCidade').value.trim() };
  });
}

}
function saveObjetivo() { saveAndClose(function(){ _cvData.titulo_profissional = document.getElementById('mObj').value.trim(); }); }

function editResumo() {

/* ── Editores de lista (experiências, formação, cursos, idiomas) ── */
function editExperiencias() {
  var rows = (_cvData.experiencias || []).map(function(e,i){ return expRowHtml(i, e); }).join('');
  openModal('<h3>Experiências profissionais</h3><div id="listRows">' + rows + '</div>' +
    '<button class="add-row-btn" onclick="addExpRow()">+ Adicionar experiência</button>' +
    '<div class="modal-actions"><button class="btn btn-primary" onclick="saveExperiencias()">Salvar</button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button></div>');
}
function expRowHtml(i, e) {
  e = e || {};
  return '<div class="list-row" data-i="' + i + '"><button class="list-row-remove" onclick="this.closest(\'.list-row\').remove()">✕ remover</button>' +
    '<div class="f-grid2"><div class="f-row"><label>Cargo</label><input class="e-cargo" value="' + esc(e.cargo) + '"></div>' +
    '<div class="f-row"><label>Empresa</label><input class="e-empresa" value="' + esc(e.empresa) + '"></div></div>' +
    '<div class="f-row"><label>Período</label><input class="e-periodo" placeholder="Ex: 2021 — 2024" value="' + esc(e.periodo) + '"></div>' +
    '<div class="f-row"><label>Principais atividades (uma por linha)</label><textarea class="e-bullets" id="cvvb_' + i + '" rows="3">' + esc((e.bullets||[]).join('\n')) + '</textarea>' +
    cvVoiceBlock('cvvb_' + i, 'bullets', i, 'Conte o que você fazia nesse cargo e o que entregou — a IA transforma em linhas de currículo.') + '</div></div>';
}

/* Entrada por voz (/js/cv-voice.js). Devolve '' se o módulo não carregou —
   o campo continua funcionando por texto. */
function cvVoiceBlock(key, field, idx, hint) {
  return window.CvVoice ? CvVoice.block(key, field, idx, hint) : '';
}

if (window.CvVoice) {
  CvVoice.init({
    getToken: async function() {
      try {
        var r = await sb.auth.getSession();
        var s = r && r.data && r.data.session;
        if (s) _session = s;
      } catch(e) {}
      return (_session && _session.access_token) || '';
    },
    // Os campos aqui não têm ids fixos como no /cv: cargo e empresa vivem na
    // mesma .list-row do textarea, por classe.
    getContext: function(field, idx) {
      var ctx = {};
      if (field === 'resumo') {
        ctx.titulo = (_cvData && _cvData.titulo_profissional) || '';
      } else {
        var ta = document.getElementById('cvvb_' + idx);
        var row = ta && ta.closest('.list-row');
        if (row) {
          var c = row.querySelector('.e-cargo'), em = row.querySelector('.e-empresa');
          if (c) ctx.cargo = c.value;
          if (em) ctx.empresa = em.value;
        }
      }
      return ctx;
    }
  });
}
function addExpRow() { document.getElementById('listRows').insertAdjacentHTML('beforeend', expRowHtml(Date.now(), {})); }
function saveExperiencias() {
  saveAndClose(function(){
    var rows = document.querySelectorAll('#listRows .list-row');
    _cvData.experiencias = Array.from(rows).map(function(r){
      return {
        cargo: r.querySelector('.e-cargo').value.trim(),
        empresa: r.querySelector('.e-empresa').value.trim(),
        periodo: r.querySelector('.e-periodo').value.trim(),
        bullets: r.querySelector('.e-bullets').value.split('\n').map(function(s){return s.trim();}).filter(Boolean)
      };
    }).filter(function(e){ return e.cargo || e.empresa; });
  });
}

function editFormacao() {
  var rows = (_cvData.formacao || []).map(function(e,i){ return simpleRowHtml('f', i, e, 'curso', 'Curso', 'instituicao', 'Instituição'); }).join('');
  openModal('<h3>Formação acadêmica</h3><div id="listRows">' + rows + '</div>' +
    '<button class="add-row-btn" onclick="addSimpleRow(\'f\',\'curso\',\'Curso\',\'instituicao\',\'Instituição\')">+ Adicionar formação</button>' +
    '<div class="modal-actions"><button class="btn btn-primary" onclick="saveSimpleList(\'formacao\',\'f\',\'curso\',\'instituicao\')">Salvar</button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button></div>');
}
function editCursos() {
  var rows = (_cvData.cursos || []).map(function(e,i){ return simpleRowHtml('c', i, e, 'nome', 'Curso / especialização', 'instituicao', 'Instituição'); }).join('');
  openModal('<h3>Cursos e especializações</h3><div id="listRows">' + rows + '</div>' +
    '<button class="add-row-btn" onclick="addSimpleRow(\'c\',\'nome\',\'Curso / especialização\',\'instituicao\',\'Instituição\')">+ Adicionar curso</button>' +
    '<div class="modal-actions"><button class="btn btn-primary" onclick="saveSimpleList(\'cursos\',\'c\',\'nome\',\'instituicao\')">Salvar</button><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button></div>');

function simpleRowHtml(ns, i, e, k1, l1, k2, l2) {
  e = e || {};
  return '<div class="list-row" data-i="' + i + '"><button class="list-row-remove" onclick="this.closest(\'.list-row\').remove()">✕ remover</button>' +
    '<div class="f-row"><label>' + l1 + '</label><input class="' + ns + '-k1" value="' + esc(e[k1]) + '"></div>' +
    '<div class="f-grid2"><div class="f-row"><label>' + l2 + '</label><input class="' + ns + '-k2" value="' + esc(e[k2]) + '"></div>' +
    '<div class="f-row"><label>Período</label><input class="' + ns + '-periodo" placeholder="Ex: 2019 — 2023" value="' + esc(e.periodo) + '"></div></div></div>';
}
function addSimpleRow(ns, k1, l1, k2, l2) { document.getElementById('listRows').insertAdjacentHTML('beforeend', simpleRowHtml(ns, Date.now(), {}, k1, l1, k2, l2)); }
function saveSimpleList(field, ns, k1, k2) {
  saveAndClose(function(){
    var rows = document.querySelectorAll('#listRows .list-row');
    _cvData[field] = Array.from(rows).map(function(r){
      var o = {}; o[k1] = r.querySelector('.'+ns+'-k1').value.trim(); o[k2] = r.querySelector('.'+ns+'-k2').value.trim(); o.periodo = r.querySelector('.'+ns+'-periodo').value.trim();
      return o;
    }).filter(function(o){ return o[k1]; });
  });
}

function editIdiomas() {
  var rows = (_cvData.idiomas || []).map(function(e,i){ return idiomaRowHtml(i, e); }).join('');

function idiomaRowHtml(i, e) {
  e = e || {};
  var niveis = ['Básico','Intermediário','Avançado','Fluente','Nativo'];
  return '<div class="list-row" data-i="' + i + '"><button class="list-row-remove" onclick="this.closest(\'.list-row\').remove()">✕ remover</button>' +
    '<div class="f-grid2"><div class="f-row"><label>Idioma</label><input class="i-idioma" value="' + esc(e.idioma) + '"></div>' +
    '<div class="f-row"><label>Nível</label><select class="i-nivel">' + niveis.map(function(n){return '<option'+(e.nivel===n?' selected':'')+'>'+n+'</option>';}).join('') + '</select></div></div></div>';
}
function addIdiomaRow() { document.getElementById('listRows').insertAdjacentHTML('beforeend', idiomaRowHtml(Date.now(), {})); }
function saveIdiomas() {
  saveAndClose(function(){
    var rows = document.querySelectorAll('#listRows .list-row');
    _cvData.idiomas = Array.from(rows).map(function(r){ return { idioma: r.querySelector('.i-idioma').value.trim(), nivel: r.querySelector('.i-nivel').value }; }).filter(function(o){ return o.idioma; });
  });

/* ── Painel de posicionamento de mercado ──────────────────────────────────
   Hero card sempre gratuito e automático — sem custo de IA, sem crédito.
   Cruza keywords_faltando de TODAS as análises de vaga que o usuário já
   fez na plataforma com o texto do currículo atual: mostra o que o
   mercado dele pede com frequência e o currículo ainda não cobre. */
function gapHeroShell(sub, metricsHtml, sideHtml) {
  return '<div class="gap-copy"><div class="gap-title">Posicionamento de mercado</div>' +
    '<h2 class="gap-h2">Veja como seu currículo se compara ao que o mercado pede.</h2>' +
    '<p class="gap-sub">' + sub + '</p>' +
    (metricsHtml ? '<div class="gap-metrics">' + metricsHtml + '</div>' : '') +
    '</div><div class="gap-side">' + sideHtml + '</div>';
}
function metric(val, label) { return '<div><strong>' + esc(String(val)) + '</strong><span>' + esc(label) + '</span></div>'; }

async function loadGapPanel() {
  var panel = document.getElementById('gapPanel');
  if (!_session) {
    panel.innerHTML = gapHeroShell(
      'Salve seu currículo (crie uma conta grátis) e, conforme você for analisando vagas, esse painel vai mostrando o que o mercado pede e seu currículo ainda não tem.',
      '', '<div class="gap-side-label">Lacunas identificadas</div><div class="gap-empty">Disponível após salvar seu currículo</div>'
    );
    return;
  }
  try {
    var r = await sb.from('analyses').select('result').eq('user_id', _session.user.id).order('created_at', { ascending: false }).limit(50);
    var rows = (r && r.data) || [];
    if (!rows.length) {
      panel.innerHTML = gapHeroShell(
        'Analise pelo menos 1 vaga pra começarmos a te mostrar o que o mercado espera do seu perfil — esse painel se atualiza sozinho conforme você usa a plataforma.',
        metric(0, 'vagas analisadas') + metric('—', 'lacunas identificadas'),
        '<div class="gap-side-label">Lacunas identificadas</div><div class="gap-empty">Analise sua primeira vaga pra começar</div>'
      );
      return;
    }
    var freq = {};
    rows.forEach(function(row){
      var res = row.result || {};
      (res.keywords_faltando || []).forEach(function(k){
        var key = String(k).trim();
        if (!key) return;
        freq[key] = (freq[key] || 0) + 1;
      });
    });
    var cvText = cvToText(_cvData).toLowerCase();
    var allKeys = Object.keys(freq);
    var gaps = allKeys
      .filter(function(k){ return cvText.indexOf(k.toLowerCase()) === -1; })
      .sort(function(a,b){ return freq[b] - freq[a]; });
    var covered = allKeys.length - gaps.length;
    var metricsHtml = metric(rows.length, 'vagas analisadas') + metric(covered, 'competências em comum') + metric(gaps.length, 'lacunas identificadas');

    if (!gaps.length) {
      panel.innerHTML = gapHeroShell(
        'Baseado nas ' + rows.length + ' vaga(s) que você já analisou, seu currículo já cobre as competências mais pedidas pelo mercado. 👏',
        metricsHtml,
        '<div class="gap-side-label">Lacunas identificadas</div><div class="gap-empty">Nenhuma lacuna no momento</div>'
      );
      return;
    }
    var top = gaps.slice(0, 8);
    panel.innerHTML = gapHeroShell(
      'Baseado nas ' + rows.length + ' vaga(s) que você já analisou, seu currículo ainda não menciona estas competências — conforme você analisa mais vagas, esse painel fica mais preciso.',
      metricsHtml,
      '<div class="gap-side-label">Lacunas identificadas</div><div class="gap-chips">' + top.map(function(k){ return '<span class="gap-chip">' + esc(k) + (freq[k]>1 ? ' <b>×' + freq[k] + '</b>' : '') + '</span>'; }).join('') + '</div>'
    );
  } catch(e) {
    panel.innerHTML = gapHeroShell('Não foi possível carregar agora.', '', '');
  }
}
