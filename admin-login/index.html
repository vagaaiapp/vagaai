<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VagaAI — Admin Login</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0a0f0d;
  color:#e8ede9;
  font-family:'Inter',sans-serif;
  font-size:15px;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1.5rem
}
.container{
  background:#111814;
  border:1px solid rgba(255,255,255,0.07);
  border-radius:16px;
  padding:2.5rem;
  width:100%;
  max-width:400px
}
.title{
  font-size:26px;
  font-weight:700;
  margin-bottom:0.4rem
}
.subtitle{
  font-size:14px;
  color:#8a9e90;
  margin-bottom:1.8rem;
  line-height:1.5
}
.badge{
  display:inline-block;
  background:rgba(255,107,107,0.12);
  border:1px solid rgba(255,107,107,0.25);
  color:#ff6b6b;
  padding:0.4rem 0.8rem;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.05em;
  text-transform:uppercase;
  margin-bottom:1rem
}
.field{
  display:flex;
  flex-direction:column;
  gap:0.4rem;
  margin-bottom:1rem
}
label{
  font-size:13px;
  font-weight:600
}
input[type="email"],input[type="password"]{
  background:#0a0f0d;
  border:1px solid rgba(255,255,255,0.07);
  border-radius:10px;
  color:#e8ede9;
  font-family:'Inter',sans-serif;
  font-size:16px;
  padding:0.85rem 1rem;
  width:100%;
  transition:border-color 0.2s
}
input:focus{
  outline:none;
  border-color:rgba(62,207,142,0.25)
}
.btn{
  width:100%;
  background:#3ecf8e;
  color:#0a0f0d;
  font-family:'Inter',sans-serif;
  font-size:15px;
  font-weight:700;
  border:none;
  border-radius:10px;
  padding:1rem;
  cursor:pointer;
  transition:all 0.2s;
  margin-top:0.5rem
}
.btn:hover{
  background:#4ddb9e
}
.btn:disabled{
  opacity:0.6;
  cursor:not-allowed
}
.alert{
  border-radius:10px;
  padding:1rem 1.2rem;
  font-size:14px;
  margin-top:1rem;
  display:none
}
.alert.show{
  display:block
}
.alert-error{
  background:rgba(255,107,107,0.12);
  border:1px solid rgba(255,107,107,0.25);
  color:#ff8f8f
}
.alert-success{
  background:rgba(62,207,142,0.12);
  border:1px solid rgba(62,207,142,0.25);
  color:#3ecf8e
}
.info{
  background:rgba(100,200,255,0.1);
  border:1px solid rgba(100,200,255,0.25);
  border-radius:10px;
  padding:1rem 1.2rem;
  font-size:13px;
  line-height:1.6;
  color:#64c8ff;
  margin-bottom:1.5rem
}
</style>
</head>
<body>

<div class="container">
  <div class="badge">🔒 Apenas Admin</div>

  <div class="title">Admin Login</div>
  <p class="subtitle">Acesso exclusivo para administradores do VagaAI.</p>

  <div class="info">
    ⚠️ Esta página é <strong>PRIVADA</strong>. Apenas você pode acessar.
  </div>

  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
  </div>

  <div class="field">
    <label for="password">Senha</label>
    <input type="password" id="password" placeholder="••••••••" minlength="6">
  </div>

  <button class="btn" id="loginBtn" onclick="handleLogin()">Entrar</button>

  <div class="alert alert-error" id="errorMsg"></div>
  <div class="alert alert-success" id="successMsg"></div>
</div>

<script>
const SUPABASE_URL = 'https://kbcjchjepgejdezeuwwh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtiY2pjaGplcGdlamRlemV1d3doIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTY4Njg5NzksImV4cCI6MTczMjQ2MDk3OX0.dq8pWIFWg_JsLxPDtJI1_6TP1K2qNkJ1Z-wvHzUXEJA';
const ADMIN_EMAILS = ['jvhr96@gmail.com'];

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function handleLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const errorEl = document.getElementById('errorMsg');
  const successEl = document.getElementById('successMsg');

  errorEl.textContent = '';
  errorEl.classList.remove('show');
  successEl.textContent = '';
  successEl.classList.remove('show');

  if (!email || !password) {
    errorEl.textContent = 'Preencha email e senha.';
    errorEl.classList.add('show');
    return;
  }

  if (!ADMIN_EMAILS.includes(email)) {
    errorEl.textContent = '❌ Acesso negado. Este email não é admin.';
    errorEl.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Entrando...';

  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      errorEl.textContent = 'Email ou senha incorretos.';
      errorEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return;
    }

    successEl.textContent = '✅ Login bem-sucedido! Redirecionando...';
    successEl.classList.add('show');

    setTimeout(() => {
      window.location.href = '/admin?redirect=login';
    }, 1500);
  } catch (e) {
    errorEl.textContent = 'Erro ao conectar. Tente novamente.';
    errorEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

// Enter key submit
document.getElementById('password').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') handleLogin();
});

// Check if already logged in
(async () => {
  const { data } = await supabase.auth.getSession();
  if (data?.session) {
    window.location.href = '/admin';
  }
})();
</script>

</body>
</html>
