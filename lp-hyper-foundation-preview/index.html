<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Prévia visual · VagaAI</title>
  <style>
    html,body{min-height:100%;margin:0;background:#072724;color:#fff;font:16px/1.5 system-ui,sans-serif}
    .preview-loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .preview-loading span{display:block;width:42px;height:42px;margin:0 auto 18px;border:1px solid rgba(151,252,215,.28);border-top-color:#97fcd7;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="preview-loading"><div><span></span>Preparando a prévia visual…</div></div>
  <script>
    fetch('/index.template.html', {cache:'no-store'})
      .then(function(response){
        if(!response.ok) throw new Error('Não foi possível carregar a LP original.');
        return response.text();
      })
      .then(function(source){
        source = source.replace('<script defer src="/_vercel/insights/script.js"></scr' + 'ipt>', '');
        source = source.replace(/<link[^>]*href="\/assets\/(?:dashboard-faca-agora-editorial|lp-jornada-curriculo)\.webp"[^>]*>/gi, '');
        source = source.replace('</head>', '<link rel="stylesheet" href="/lp-hyper-foundation-preview/styles.css?v=2"></head>');
        document.open();
        document.write(source);
        document.close();
      })
      .catch(function(error){
        document.querySelector('.preview-loading').innerHTML = '<strong>Prévia indisponível.</strong><br>' + error.message;
      });
  </script>
</body>
</html>
